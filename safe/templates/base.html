<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Campus Portal{% endblock %} — Campus University</title>
  <meta name="description" content="Campus University Student Portal — access courses, grades, and announcements.">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

{% if current_user %}
<nav class="topnav" role="navigation" aria-label="Main navigation">
  <div class="topnav-inner">
    <!-- Logo -->
    <a class="nav-logo" href="{{ url_for('dashboard') }}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      Campus Portal
    </a>
    <!-- Version badge — green for SAFE -->
    <span class="version-badge" aria-label="Version: {{ version }}">{{ version }}</span>

    <!-- Nav links -->
    <div class="nav-links">
      <a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}class="active"{% endif %}>
        Dashboard
      </a>
      <a href="{{ url_for('search') }}" {% if request.endpoint == 'search' %}class="active"{% endif %}>
        Courses
      </a>
      <a href="{{ url_for('profile') }}" {% if request.endpoint == 'profile' %}class="active"{% endif %}>
        Profile
      </a>
      <a href="{{ url_for('change_email') }}" {% if request.endpoint == 'change_email' %}class="active"{% endif %}>
        Settings
      </a>
      {% if current_user['role'] == 'admin' %}
      <a href="{{ url_for('admin_users') }}" {% if request.endpoint == 'admin_users' %}class="active"{% endif %}>
        Admin
      </a>
      {% endif %}
    </div>

    <!-- User chip -->
    <div class="nav-user">
      <div class="avatar" aria-hidden="true">{{ current_user['username'][0] }}</div>
      <span class="nav-username">{{ current_user['username'] }}</span>
      <a href="{{ url_for('logout') }}" class="btn-logout">Sign out</a>
    </div>
  </div>
</nav>
{% endif %}

<main class="page-main" id="main-content">
  <div class="wrapper">
    {% block content %}{% endblock %}
  </div>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
